<!DOCTYPE html>
<!-- ファイル名: koe-vocalo.html ／ こえボカロ（自分の声で歌うボカロ風アプリ） -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>こえボカロ</title>
<style>
:root{--bg:#fff7ef;--ink:#3b3330;--sub:#8a7f78;--acc:#18b7a8;--acc2:#ff6f91;--line:#eadfd3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;background:linear-gradient(90deg,#18b7a8,#5fd6c9);color:#fff;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:1px}
nav{display:flex;gap:8px}
nav .tab{background:rgba(255,255,255,.25);color:#fff;border-color:transparent;font-size:17px}
nav .tab.on{background:#fff;color:var(--acc)}
button{font:inherit;font-size:15px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:7px 13px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button.warn{color:#c0395e}
select,input[type=number],input[type=text]{font:inherit;font-size:15px;padding:5px 7px;border-radius:9px;border:2px solid var(--line);background:#fff}
input[type=number]{width:70px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:12px}
.page{display:none;padding:12px}
.page.on{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.small{font-size:13px;color:var(--sub)}
.msg{min-height:1.4em;color:#d0456b;font-weight:bold;margin:6px 0}
/* 声をつくる */
.vwrap{display:grid;grid-template-columns:340px 1fr;gap:12px;align-items:start}
#bigMora{font-size:76px;text-align:center;font-weight:bold;color:var(--acc);line-height:1.15}
button.rec{background:var(--acc2);color:#fff;border-color:var(--acc2);font-size:22px;width:100%;padding:12px}
#wave{width:100%;height:110px;background:#faf6f1;border-radius:10px;display:block;margin-top:6px}
#meter{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:6px}
#meterBar{height:100%;width:0;background:var(--acc2);transition:width .05s}
.tip{background:#fff3d6;border-radius:10px;padding:8px 10px;font-size:15px;margin:8px 0 0}
details{margin:4px 0 10px}
summary{font-size:17px;font-weight:bold;cursor:pointer;color:var(--acc)}
.mgrid{display:grid;gap:6px;margin:8px 0;max-width:420px}
.mora{font-size:21px;padding:7px 0;border-radius:10px}
.mora.done{background:#d9f5f1;border-color:var(--acc)}
.mora.sel{outline:3px solid var(--acc2);outline-offset:1px}
.mora.empty{visibility:hidden}
.count{font-size:17px;font-weight:bold}
/* 曲をつくる */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px}
#btnPlay{background:var(--acc);color:#fff;border-color:var(--acc);font-size:17px;min-width:120px}
.trk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border-radius:12px}
.trk input[type=range]{width:100px}
.trk label{font-size:12px;color:var(--sub)}
#vocalBar input[type=text]{flex:1;min-width:220px}
#vocalBar input[type=range]{width:110px}
#rollWrap{position:relative;overflow:auto;height:calc(100vh - 400px);min-height:300px;background:#fff;border-radius:12px;border:2px solid var(--line);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#rollWrap.pan{touch-action:pan-x pan-y}
button,select,input{touch-action:manipulation}
#btnMode.pan{background:#ffe9a8;border-color:#f0c040}
#selBar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
#roll{display:block}
#playLine{position:absolute;top:0;width:2px;background:#ff3b6b;display:none;pointer-events:none}
@media (max-width:820px){.vwrap{grid-template-columns:1fr}}
@media (max-width:600px){
  .page{padding:8px}
  .card{padding:8px}
  button{font-size:14px;padding:6px 10px}
  .toolbar{gap:6px}
  .sep{display:none}
  .trk{flex-direction:row;padding:2px}
  .trk input[type=range]{width:64px}
  #rollHelp{display:none}
  #rollWrap{height:72vh}
}
</style>
</head>
<body>
<header>
  <h1>🎤 こえボカロ</h1>
  <nav>
    <button class="tab on" data-tab="voice">① 声をつくる</button>
    <button class="tab" data-tab="song">② 曲をつくる</button>
  </nav>
</header>

<!-- ① 声をつくる -->
<section id="voice" class="page on">
  <div class="vwrap">
    <div class="card">
      <div id="bigMora">あ</div>
      <button id="btnRec" class="rec">● 録音</button>
      <div class="row">
        <button id="btnPlayRaw">▶ きく</button>
        <button id="btnSing">♪ うたわせる</button>
        <button id="btnDelOne" class="warn">けす</button>
      </div>
      <canvas id="wave" width="640" height="220"></canvas>
      <div id="vinfo" class="small"></div>
      <div id="meter"><div id="meterBar"></div></div>
      <div id="recMsg" class="msg"></div>
      <div class="row">
        <label>録音の高さ
          <select id="baseNote">
            <option value="45">ラ2（ひくい）</option>
            <option value="48">ド3</option>
            <option value="53" selected>ファ3</option>
            <option value="57">ラ3</option>
            <option value="60">ド4</option>
            <option value="64">ミ4（たかい）</option>
          </select>
        </label>
      </div>
      <label class="row"><input type="checkbox" id="autoNext" checked> 録音したら つぎの音へ</label>
      <p class="tip">ピッ・ピッ・ピッ のあとに<br>「かーーー」と ピッと同じ高さで<br>1びょう のばして言う</p>
    </div>
    <div class="card">
      <div class="count" id="voiceCount"></div>
      <div class="small">録音していない音は、母音（あいうえお）か「機械の声」で歌います</div>
      <div id="grid"></div>
      <div class="row">
        <button id="btnExpVoice">💾 声をファイルに保存</button>
        <button id="btnImpVoice">📂 声のファイルをひらく</button>
        <button id="btnClrVoice" class="warn">ぜんぶけす</button>
        <input type="file" id="fileVoice" accept=".json" hidden>
      </div>
    </div>
  </div>
</section>

<!-- ② 曲をつくる -->
<section id="song" class="page">
  <div class="card toolbar">
    <button id="btnPlay">▶ さいせい</button>
    <button id="btnUndo">↩ もどす</button>
    <span class="sep"></span>
    <label>テンポ <input type="number" id="bpm" min="40" max="240" value="110"></label>
    <label>小節 <input type="number" id="bars" min="1" max="64" value="8"></label>
    <label>音符
      <select id="snap">
        <option value="1">16分</option>
        <option value="2" selected>8分</option>
        <option value="4">4分</option>
        <option value="8">2分</option>
      </select>
    </label>
    <button id="btnMode">✏️ かく</button>
    <button id="btnEraser">🧽 けしゴム</button>
    <span class="sep"></span>
    <button id="btnWav">🎵 WAVで保存</button>
  </div>
  <div class="card toolbar" id="trackBar"></div>
  <div class="card toolbar" id="vocalBar">
    <label>歌詞</label>
    <input type="text" id="lyricText" placeholder="れい：あおいそらに（ひらがな）">
    <button id="btnFlow">音符に ながしこむ</button>
    <label>ビブラート <input type="range" id="vib" min="0" max="80" value="35"></label>
    <label>声色 おとな <input type="range" id="gen" min="-5" max="5" value="0"> こども</label>
  </div>
  <div id="selBar">
    <button id="btnLyric" disabled>🔤 歌詞をかえる</button>
    <button id="btnDelNote" class="warn" disabled>🗑 この音符をけす</button>
    <span class="small" id="rollHelp">タップ：音符をおく ／ ドラッグ：うごかす・のばす ／ 右はし：長さ ／ 上の目もり：再生する場所 ／ ✋にすると指でスクロール</span>
  </div>
  <div id="rollWrap"><canvas id="roll"></canvas><div id="playLine"></div></div>
  <div id="songMsg" class="msg"></div>
  <div class="row">
    <button id="btnSaveSong">💾 曲を保存</button>
    <button id="btnOpenSong">📂 曲をひらく</button>
    <button id="btnDemo">🎼 サンプル曲</button>
    <button id="btnClrSong" class="warn">ぜんぶけす</button>
    <input type="file" id="fileSong" accept=".json" hidden>
  </div>
</section>

<script>
'use strict';
// ファイル名: koe-vocalo.html
const FILE_NAME = 'koe-vocalo.html';
const AC = new (window.AudioContext || window.webkitAudioContext)();
const SR = AC.sampleRate;

// ==DSP==
function hz(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function median(a){ const b = Array.from(a).sort((x, y) => x - y); return b[Math.floor(b.length / 2)]; }

// 前後の無音をけずる
function trimSilence(x){
  const fr = Math.round(SR * 0.01), nF = Math.floor(x.length / fr);
  if (nF < 5) return null;
  let mean = 0; for (let i = 0; i < x.length; i++) mean += x[i]; mean /= x.length;
  const r = new Float32Array(nF); let pk = 0;
  for (let i = 0; i < nF; i++){
    let s = 0; for (let j = 0; j < fr; j++){ const v = x[i * fr + j] - mean; s += v * v; }
    r[i] = Math.sqrt(s / fr); if (r[i] > pk) pk = r[i];
  }
  if (pk < 0.008) return null;
  const nf = Array.from(r).sort((a, b) => a - b)[Math.floor(nF * 0.1)];
  const thr = Math.max(nf * 4, pk * 0.06, 0.002);
  let a = 0; while (a < nF && r[a] < thr) a++;
  let b = nF - 1; while (b > a && r[b] < thr) b--;
  const s0 = Math.max(0, (a - 3) * fr), s1 = Math.min(x.length, (b + 3) * fr);
  if (s1 - s0 < SR * 0.15) return null;
  const y = new Float32Array(s1 - s0);
  for (let i = 0; i < y.length; i++) y[i] = x[s0 + i] - mean;
  const fl = Math.round(SR * 0.005);
  for (let i = 0; i < fl; i++){ const k = i / fl; y[i] *= k; y[y.length - 1 - i] *= k; }
  return y;
}

function rmsOf(x, a, b){ let s = 0; a = Math.max(0, a | 0); b = Math.min(x.length, b | 0); for (let i = a; i < b; i++) s += x[i] * x[i]; return Math.sqrt(s / Math.max(1, b - a)); }
function unvoicedS(raw){ return { ok: false, raw, gain: Math.min(30, 0.2 / Math.max(1e-4, rmsOf(raw, 0, raw.length))), f0: 0 }; }

// 声を分析：音の高さ・母音のはじまり・ピッチマーク
function analyze(raw){
  const N = raw.length;
  const dec = Math.max(1, Math.round(SR / 11025)), dsr = SR / dec;
  const n = Math.floor(N / dec), x = new Float32Array(n);
  for (let i = 0; i < n; i++){ let s = 0; for (let j = 0; j < dec; j++) s += raw[i * dec + j]; x[i] = s / dec; }
  const hop = Math.max(1, Math.round(dsr * 0.005)), W = Math.round(dsr * 0.03);
  const minLag = Math.max(2, Math.floor(dsr / 1000)), maxLag = Math.ceil(dsr / 65);
  const F = [], V = [], R = [];
  const d = new Float32Array(maxLag + 2), cm = new Float32Array(maxLag + 2);
  for (let c = 0; c + W + maxLag + 1 < n; c += hop){
    let e = 0; for (let j = 0; j < W; j++) e += x[c + j] * x[c + j];
    R.push(Math.sqrt(e / W));
    for (let tau = 1; tau <= maxLag + 1; tau++){
      let s = 0; for (let j = 0; j < W; j++){ const df = x[c + j] - x[c + j + tau]; s += df * df; }
      d[tau] = s;
    }
    let run = 0; cm[0] = 1;
    for (let tau = 1; tau <= maxLag + 1; tau++){ run += d[tau]; cm[tau] = run > 0 ? d[tau] * tau / run : 1; }
    let best = -1;
    for (let tau = minLag; tau <= maxLag; tau++){
      if (cm[tau] < 0.15){ while (tau + 1 <= maxLag && cm[tau + 1] < cm[tau]) tau++; best = tau; break; }
    }
    if (best < 0){
      let mv = 1e9, bt = minLag;
      for (let tau = minLag; tau <= maxLag; tau++) if (cm[tau] < mv){ mv = cm[tau]; bt = tau; }
      best = mv <= 0.3 ? bt : -1;
    }
    if (best > 0){
      const A = cm[best - 1], B = cm[best], C = cm[best + 1];
      const den = A - 2 * B + C; let sh = den !== 0 ? 0.5 * (A - C) / den : 0;
      sh = Math.max(-1, Math.min(1, sh));
      F.push(dsr / (best + sh)); V.push(1);
    } else { F.push(0); V.push(0); }
  }
  const nf = F.length;
  if (nf < 12) return unvoicedS(raw);
  let pkR = 0; for (const r of R) if (r > pkR) pkR = r;
  for (let i = 0; i < nf; i++) if (R[i] < pkR * 0.08) V[i] = 0;
  const vf = F.filter((f, i) => V[i]);
  if (vf.length < 10) return unvoicedS(raw);
  const med = median(vf);
  for (let i = 0; i < nf; i++) if (V[i]){
    let f = F[i]; while (f > med * 1.7) f /= 2; while (f < med * 0.6) f *= 2; F[i] = f;
  }
  const F2 = F.slice();
  for (let i = 0; i < nf; i++) if (V[i]){
    const nb = []; for (let k = i - 2; k <= i + 2; k++) if (k >= 0 && k < nf && V[k]) nb.push(F[k]);
    F2[i] = median(nb);
  }
  const fc = i => (i * hop + W / 2) * dec;
  const frameAt = s => Math.max(0, Math.min(nf - 1, Math.round((s / dec - W / 2) / hop)));
  const K = 8;
  let vsF = -1;
  for (let i = 0; i + K <= nf && vsF < 0; i++){ let ok = true; for (let k = 0; k < K; k++) if (!V[i + k]){ ok = false; break; } if (ok) vsF = i; }
  if (vsF < 0) return unvoicedS(raw);
  let veF = -1;
  for (let i = nf - 1; i - K + 1 >= 0 && veF < 0; i--){ let ok = true; for (let k = 0; k < K; k++) if (!V[i - k]){ ok = false; break; } if (ok) veF = i; }
  veF -= 6;
  if (veF < vsF + 10) veF = Math.min(nf - 1, vsF + 10);
  const vs = Math.round(fc(vsF)), ve = Math.min(N - 1, Math.round(fc(veF)));
  // ピーク検出用に少しなめらかにした信号
  const lp = new Float32Array(N), hk = Math.max(1, Math.round(SR * 0.0006));
  let acc = 0;
  for (let i = 0; i < N + hk; i++){
    if (i < N) acc += raw[i];
    if (i - 2 * hk - 1 >= 0) acc -= raw[i - 2 * hk - 1];
    const c = i - hk; if (c >= 0 && c < N) lp[c] = acc;
  }
  const pos = [], per = [], voi = [];
  const U = Math.round(SR * 0.005);
  let s = 0, lastV = false;
  while (s < N){
    const fi = frameAt(s);
    if (V[fi]){
      const Pp = SR / F2[fi];
      const center = lastV ? s : s + Pp * 0.5, rad = lastV ? Pp * 0.15 : Pp * 0.5;
      const a = Math.max(0, Math.floor(center - rad)), b = Math.min(N - 1, Math.ceil(center + rad));
      let bi = a, bv = -1e9; for (let i = a; i <= b; i++) if (lp[i] > bv){ bv = lp[i]; bi = i; }
      if (bi < s - Pp * 0.5) bi = Math.round(s);
      pos.push(bi); per.push(Pp); voi.push(1); s = bi + Pp; lastV = true;
    } else {
      pos.push(Math.round(s)); per.push(U); voi.push(0); s += U; lastV = false;
    }
  }
  const gain = Math.min(30, 0.2 / Math.max(1e-4, rmsOf(raw, vs, ve)));
  const ls = vs + Math.round((ve - vs) * 0.35);
  return { ok: true, raw, vs, ve, ls, pos: Int32Array.from(pos), per: Float32Array.from(per), voi: Uint8Array.from(voi), gain, f0: med };
}

function nearestMark(pos, t){
  let lo = 0, hi = pos.length - 1;
  while (hi - lo > 1){ const m = (lo + hi) >> 1; if (pos[m] <= t) lo = m; else hi = m; }
  return Math.abs(pos[hi] - t) < Math.abs(pos[lo] - t) ? hi : lo;
}

function addGrain(out, ws, t, raw, m, P, g){
  const L = Math.max(2, Math.round(P / g)), tc = Math.round(t);
  for (let j = -L; j <= L; j++){
    const o = tc + j; if (o < 0 || o >= out.length) continue;
    const xi = m + j * g, i0 = Math.floor(xi);
    if (i0 < 0 || i0 + 1 >= raw.length) continue;
    const w = 0.5 + 0.5 * Math.cos(Math.PI * j / L);
    const fr = xi - i0;
    out[o] += w * (raw[i0] + (raw[i0 + 1] - raw[i0]) * fr);
    ws[o] += w;
  }
}

// 1つの音符を歌わせる（TD-PSOLA）
// 返り値 buf の 0 は「音符のはじまり − pre（子音のぶん）」
function renderNote(S, midi, durSec, prevMidi, noCons, vib, g){
  const dur = Math.max(1, Math.round(durSec * SR));
  if (!S.ok){
    const len = Math.min(S.raw.length, dur), out = new Float32Array(len);
    for (let i = 0; i < len; i++) out[i] = S.raw[i] * S.gain;
    fadeEdges(out, 64, Math.round(SR * 0.02));
    return { buf: out, pre: 0 };
  }
  const { raw, pos, per, voi, vs, ve, ls } = S;
  const pre = noCons ? 0 : Math.min(vs, Math.round(SR * 0.25));
  const total = pre + dur;
  const out = new Float32Array(total), ws = new Float32Array(total);
  const first = Math.max(1, ve - vs), loopLen = Math.max(1, ve - ls);
  const tauOf = tv => {
    if (tv < first) return vs + tv;
    const e = tv - first, k = Math.floor(e / loopLen), r = e - k * loopLen;
    return (k % 2 === 0) ? ve - r : ls + r;
  };
  const vibStart = 0.22;
  const pitchAt = sec => {
    let m = midi;
    if (prevMidi != null && prevMidi !== midi){
      const T = 0.08;
      if (sec <= 0) m = prevMidi;
      else if (sec < T){ const k = sec / T; m = prevMidi + (midi - prevMidi) * k * k * (3 - 2 * k); }
    }
    if (vib > 0 && durSec > 0.35 && sec > vibStart){
      const dep = vib * Math.min(1, (sec - vibStart) / 0.3);
      m += dep / 100 * Math.sin(2 * Math.PI * 5.5 * (sec - vibStart));
    }
    return hz(m);
  };
  let t = 0;
  while (t < total){
    const tv = t - pre;
    const mi = nearestMark(pos, tauOf(tv));
    if (voi[mi]){ addGrain(out, ws, t, raw, pos[mi], per[mi], g); t += SR / pitchAt(tv / SR); }
    else { addGrain(out, ws, t, raw, pos[mi], per[mi], 1); t += per[mi]; }
  }
  for (let i = 0; i < total; i++) out[i] = out[i] / Math.max(1, ws[i]) * S.gain;
  fadeEdges(out, noCons ? Math.round(SR * 0.015) : 64, Math.round(SR * 0.025));
  return { buf: out, pre };
}

function fadeEdges(a, fi, fo){
  fi = Math.min(fi, a.length >> 1); fo = Math.min(fo, a.length >> 1);
  for (let i = 0; i < fi; i++) a[i] *= i / fi;
  for (let i = 0; i < fo; i++) a[a.length - 1 - i] *= i / fo;
}

// 機械の声（録音がないときの代わり）
const FORM = {
  a: [[800, 80, 1], [1200, 90, 0.7], [2600, 120, 0.25]],
  i: [[300, 60, 1], [2300, 100, 0.5], [3000, 120, 0.35]],
  u: [[350, 60, 1], [1300, 90, 0.35], [2400, 120, 0.15]],
  e: [[500, 70, 1], [1900, 100, 0.55], [2600, 120, 0.3]],
  o: [[500, 70, 1], [850, 80, 0.8], [2600, 120, 0.15]],
  n: [[250, 50, 1], [1200, 120, 0.08], [2300, 150, 0.05]]
};
function makeSynth(v){
  const f0 = 200, len = Math.round(SR * 0.9), y = new Float32Array(len);
  const H = Math.floor(5000 / f0), amps = [], ph = [];
  for (let h = 1; h <= H; h++){
    const f = h * f0; let e = 0;
    for (const [Fq, B, A] of FORM[v]) e += A / (1 + ((f - Fq) / B) ** 2);
    amps.push(e / Math.sqrt(h) + 0.003 / h); ph.push((h * 2.399) % 6.283);
  }
  let phi = 0, pk = 0;
  for (let i = 0; i < len; i++){
    const ff = f0 * (1 + 0.004 * Math.sin(2 * Math.PI * 0.7 * i / SR));
    phi += 2 * Math.PI * ff / SR;
    let s = 0; for (let h = 1; h <= H; h++) s += amps[h - 1] * Math.sin(h * phi + ph[h - 1]);
    y[i] = s; if (Math.abs(s) > pk) pk = Math.abs(s);
  }
  for (let i = 0; i < len; i++) y[i] *= 0.5 / pk;
  fadeEdges(y, Math.round(SR * 0.02), Math.round(SR * 0.03));
  return y;
}

  { name: 'が・ざ・だ・ば・ぱ', cols: 5, rows: [

  { name: 'きゃ・しゃ など', cols: 3, rows: [

];
const ORDER = GROUPS.flatMap(g => g.rows.flat().filter(Boolean));
const VOW = {};
[['a','あかさたなはまやらわがざだばぱぁゃ'],['i','いきしちにひみりぎじぢびぴぃ'],['u','うくすつぬふむゆるぐずづぶぷぅゅゔ'],
 ['e','えけせてねへめれげぜでべぺぇ'],['o','おこそとのほもよろをごぞどぼぽぉょ'],['n','ん']]
  .forEach(([v, s]) => { for (const c of s) VOW[c] = v; });
const VK = { a: 'あ', i: 'い', u: 'う', e: 'え', o: 'お', n: 'ん' };
const ALIAS = { 'を': 'お', 'ぢ': 'じ', 'づ': 'ず', 'ゔ': 'ぶ' };
const SMALL = 'ゃゅょぁぃぅぇぉ';
function kataToHira(s){ return s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
function normLyric(s){ s = kataToHira(s || ''); return ALIAS[s] || s; }
function vowelOf(ly){ if (!ly) return null; return VOW[ly[ly.length - 1]] || null; }
function toMorae(text){
  const t = kataToHira(text).replace(/[\s、。,.!?！？「」『』・]/g, '');
  const out = [];
  for (let i = 0; i < t.length; i++){
    let c = t[i];
    if (i + 1 < t.length && SMALL.includes(t[i + 1])){ c += t[i + 1]; i++; }
    out.push(c);
  }
  return out;
}

function resolve(ly){
  ly = normLyric(ly);
  if (voices[ly]) return { S: voices[ly], miss: false };
  const v = vowelOf(ly);
  if (v && voices[VK[v]]) return { S: voices[VK[v]], miss: true };
  return { S: synth[v || 'a'], miss: true };
}

// IndexedDB
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('koe-vocalo', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('voices');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbDo(mode, fn){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('voices', mode), st = tx.objectStore('voices');
    const out = fn(st);
    tx.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    tx.onerror = () => rej(tx.error);
  });
}
const idbPut = (k, v) => idbDo('readwrite', st => { st.put(v, k); });
const idbDel = k => idbDo('readwrite', st => { st.delete(k); });
const idbClear = () => idbDo('readwrite', st => { st.clear(); });
async function idbLoadAll(){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('voices', 'readonly'), st = tx.objectStore('voices');
    const out = {}; const rq = st.openCursor();
    rq.onsuccess = () => { const c = rq.result; if (c){ out[c.key] = c.value; c.continue(); } };
    tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error);
  });
}
function resample(x, from, to){
  if (from === to) return x;
  const n = Math.round(x.length * to / from), y = new Float32Array(n), r = from / to;
  for (let i = 0; i < n; i++){ const p = i * r, i0 = Math.floor(p), f = p - i0; y[i] = (x[i0] || 0) + ((x[i0 + 1] || 0) - (x[i0] || 0)) * f; }
  return y;
}
async function saveVoice(m, S){
  const rec = { sr: SR, raw: S.raw, an: S.ok ? { ok: true, vs: S.vs, ve: S.ve, ls: S.ls, pos: S.pos, per: S.per, voi: S.voi, gain: S.gain, f0: S.f0 } : { ok: false, gain: S.gain, f0: 0 } };
  await idbPut(m, rec);
}
async function loadVoices(){

    const all = await idbLoadAll();
    for (const [m, rec] of Object.entries(all)){
      if (rec.sr === SR && rec.an){ voices[m] = Object.assign({ raw: rec.raw }, rec.an); }
      else { const raw = resample(rec.raw, rec.sr, SR); const S = analyze(raw); voices[m] = S; saveVoice(m, S); }
    }
  } catch (e){ console.warn(e); }
  voiceVer++;
}

async function ensureMic(){
  if (micStream && micStream.getAudioTracks().some(t => t.readyState === 'live')) return;

function capture(sec){
  return new Promise(res => {
    const src = AC.createMediaStreamSource(micStream);
    const pr = AC.createScriptProcessor(2048, 1, 1);
    const chunks = []; let got = 0; const need = Math.round(sec * SR); let done = false;
    pr.onaudioprocess = e => {
      if (done) return;
      const d = e.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d)); got += d.length;
      let pk = 0; for (let i = 0; i < d.length; i++){ const a = Math.abs(d[i]); if (a > pk) pk = a; }
      $('meterBar').style.width = Math.min(100, pk * 150) + '%';
      if (got >= need){
        done = true; pr.disconnect(); src.disconnect(); $('meterBar').style.width = '0';
        const out = new Float32Array(got); let o = 0; for (const ch of chunks){ out.set(ch, o); o += ch.length; }
        res(out);
      }
    };
    src.connect(pr); pr.connect(AC.destination);
  });
}

function f32ToB64(f){
  const u = new Uint8Array(f.length * 2), dv = new DataView(u.buffer);
  for (let i = 0; i < f.length; i++) dv.setInt16(i * 2, Math.max(-1, Math.min(1, f[i])) * 32767, true);
  let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64ToF32(b){
  const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  const dv = new DataView(u.buffer), f = new Float32Array(u.length / 2);
  for (let i = 0; i < f.length; i++) f[i] = dv.getInt16(i * 2, true) / 32767;
  return f;
}

const noiseCache = new WeakMap();
function noiseBuf(c){
  let b = noiseCache.get(c);
  if (!b){ b = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; noiseCache.set(c, b); }
  return b;
}
function playPiano(c, dest, t, d, m){
  const f = hz(m), g = c.createGain();
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.35, t + 0.006);
  g.gain.setTargetAtTime(0.08, t + 0.006, 0.35); g.gain.setTargetAtTime(0, t + d, 0.08); g.connect(dest);
  const o1 = c.createOscillator(); o1.type = 'triangle'; o1.frequency.value = f;
  const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2;
  const g2 = c.createGain(); g2.gain.value = 0.25; o2.connect(g2); g2.connect(g); o1.connect(g);
  o1.start(t); o2.start(t); o1.stop(t + d + 0.6); o2.stop(t + d + 0.6);
}
function playBass(c, dest, t, d, m){
  const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(m);
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, t); lp.frequency.setTargetAtTime(400, t, 0.1);
  const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.4, t + 0.01);
  g.gain.setTargetAtTime(0.25, t + 0.01, 0.2); g.gain.setTargetAtTime(0, t + d, 0.04);
  o.connect(lp); lp.connect(g); g.connect(dest); o.start(t); o.stop(t + d + 0.3);
}
function playDrum(c, dest, t, row){
  const v = c.createGain(); v.connect(dest);
  const noise = (type, freq, q) => { const n = c.createBufferSource(); n.buffer = noiseBuf(c); const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q) f.Q.value = q; n.connect(f); f.connect(v); return n; };
  if (row === 0){

    const og = c.createGain(); og.gain.setValueAtTime(0.6, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.12);

const sec16 = () => 60 / PJ.bpm / 4;
const formantG = () => 1 + PJ.gen * 0.035;

function renderVocal(len){
  const out = new Float32Array(len), s16 = sec16(), missing = new Set();
  const notes = [...PJ.tracks.vocal].sort((a, b) => a.s - b.s);
  let prev = null, prevEnd = -1, prevVowel = 'a';
  for (let i = 0; i < notes.length; i++){
    const n = notes[i], ly = normLyric(n.lyric || 'ら'), next = notes[i + 1];
    let l = n.l; if (next && next.s < n.s + n.l) l = Math.max(1, next.s - n.s);
    if (ly === 'っ' || !ly){ prev = null; continue; }
    let S, noCons = false;
    if (ly === 'ー'){ S = resolve(VK[prevVowel]).S; noCons = true; }
    else { const r = resolve(ly); S = r.S; if (r.miss) missing.add(ly); prevVowel = vowelOf(ly) || prevVowel; }
    const prevMidi = (prev && prevEnd === n.s) ? prev.p : null;
    const { buf, pre } = renderNote(S, n.p, l * s16, prevMidi, noCons, PJ.vib, formantG());
    const st = Math.round(n.s * s16 * SR) - pre;
    for (let j = 0; j < buf.length; j++){ const o = st + j; if (o >= 0 && o < len) out[o] += buf[j]; }

  }

}
let renderCache = { key: '', buf: null, missing: null };
async function getRendered(){
  const key = JSON.stringify([PJ.tracks, PJ.bpm, PJ.bars, PJ.vol, PJ.mute, PJ.vib, PJ.gen]) + '#' + voiceVer;
  if (renderCache.key === key) return renderCache;
  const s16 = sec16(), len = Math.ceil((PJ.bars * 16 * s16 + 2) * SR);
  const oc = new OfflineAudioContext(1, len, SR);
  const comp = oc.createDynamicsCompressor();
  comp.threshold.value = -8; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
  const mg = oc.createGain(); mg.gain.value = 0.8; comp.connect(mg); mg.connect(oc.destination);
  const tg = {};
  TRACKS.forEach(t => { const g = oc.createGain(); g.gain.value = PJ.mute[t.id] ? 0 : PJ.vol[t.id]; g.connect(comp); tg[t.id] = g; });
  let missing = new Set();
  if (!PJ.mute.vocal && PJ.tracks.vocal.length){
    const r = renderVocal(len); missing = r.missing;
    const vb = oc.createBuffer(1, len, SR); vb.copyToChannel(r.out, 0);
    const src = oc.createBufferSource(); src.buffer = vb; src.connect(tg.vocal); src.start(0);
  }
  if (!PJ.mute.piano) PJ.tracks.piano.forEach(n => playPiano(oc, tg.piano, n.s * s16, n.l * s16, n.p));
  if (!PJ.mute.bass) PJ.tracks.bass.forEach(n => playBass(oc, tg.bass, n.s * s16, n.l * s16, n.p));
  if (!PJ.mute.drum) PJ.tracks.drum.forEach(n => playDrum(oc, tg.drum, n.s * s16, n.p));

  renderCache = { key, buf, missing };

}

function previewNote(track, p, n){
  AC.resume();

  if (track === 'vocal'){
    const r = resolve(n ? n.lyric : 'ら');
    playArr(renderNote(r.S, p, 0.45, null, false, 0, formantG()).buf.map(v => v * PJ.vol.vocal));
  } else {
    const g = AC.createGain(); g.gain.value = PJ.vol[track]; g.connect(AC.destination);
    if (track === 'piano') playPiano(AC, g, t, 0.4, p);

// ----- ピアノロール -----
const roll = $('roll'), rc = roll.getContext('2d'), wrap = $('rollWrap'), playLine = $('playLine');
const COARSE = window.matchMedia && matchMedia('(pointer: coarse)').matches;

let panMode = false, tap = null;
const nRows = () => curTrack === 'drum' ? DRUMS.length : PMAX - PMIN + 1;
const rowOf = p => curTrack === 'drum' ? p : PMAX - p;
const pOfRow = r => curTrack === 'drum' ? r : PMAX - r;
const ticks = () => PJ.bars * 16;
const isBlack = p => [1, 3, 6, 8, 10].includes(((p % 12) + 12) % 12);
const trackCol = id => TRACKS.find(t => t.id === id).col;

function sizeRoll(){

  roll.width = Math.floor(w * dpr); roll.height = Math.floor(h * dpr);

let drawQueued = false;
function queueDraw(){ if (!drawQueued){ drawQueued = true; requestAnimationFrame(() => { drawQueued = false; drawRoll(); }); } }
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function drawRoll(){
  const c = rc, W = KW + ticks() * CW, H = RUL + nRows() * RH, sl = wrap.scrollLeft, st = wrap.scrollTop;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  for (let r = 0; r < nRows(); r++){
    const y = RUL + r * RH, p = pOfRow(r);
    c.fillStyle = curTrack === 'drum' ? (r % 2 ? '#fbf7f2' : '#fff') : (isBlack(p) ? '#f1ece6' : '#fffdfa');
    c.fillRect(KW, y, W - KW, RH);
    if (curTrack !== 'drum' && p % 12 === 0){ c.fillStyle = '#d8cfc4'; c.fillRect(KW, y + RH - 1, W - KW, 1); }
  }
  for (let t = 0; t <= ticks(); t++){
    let col = null;
    if (t % 16 === 0) col = '#9b8f82'; else if (t % 4 === 0) col = '#d3c9be'; else if (t % snapV === 0) col = '#eee7de';
    if (col){ c.fillStyle = col; c.fillRect(KW + t * CW, RUL, t % 16 === 0 ? 2 : 1, H - RUL); }
  }
  if (curTrack !== 'drum'){
    ['vocal', 'piano', 'bass'].filter(id => id !== curTrack).forEach(id => {
      c.fillStyle = trackCol(id) + '30';
      PJ.tracks[id].forEach(n => { const r = rowOf(n.p); if (r < 0 || r >= nRows()) return; c.fillRect(KW + n.s * CW + 1, RUL + r * RH + 3, n.l * CW - 2, RH - 6); });
    });
  }
  const col = trackCol(curTrack);
  c.font = 'bold 12px sans-serif'; c.textBaseline = 'middle';
  PJ.tracks[curTrack].forEach(n => {
    const r = rowOf(n.p); if (r < 0 || r >= nRows()) return;
    const x = KW + n.s * CW + 1, y = RUL + r * RH + 1, w = n.l * CW - 2, h = RH - 2;
    const miss = curTrack === 'vocal' && !['ー', 'っ'].includes(normLyric(n.lyric)) && !voices[normLyric(n.lyric)];
    c.globalAlpha = miss ? 0.6 : 1; c.fillStyle = col; rr(c, x, y, w, h, 4); c.fill(); c.globalAlpha = 1;

    c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(x + w - 4, y + 2, 2, h - 4);

  });
  // 上の目もり
  c.fillStyle = '#f6efe7'; c.fillRect(sl, st, W - sl, RUL);
  c.fillStyle = '#6d625a'; c.font = '12px sans-serif'; c.textBaseline = 'middle';
  for (let b = 0; b < PJ.bars; b++){ const x = KW + b * 16 * CW; c.fillRect(x, st, 1, RUL); c.fillText(String(b + 1), x + 4, st + RUL / 2); }
  const px = KW + playStart * CW; c.fillStyle = '#ff3b6b'; c.beginPath(); c.moveTo(px - 6, st + 4); c.lineTo(px + 6, st + 4); c.lineTo(px, st + RUL - 2); c.fill();

    else {

}
wrap.addEventListener('scroll', queueDraw);
window.addEventListener('resize', queueDraw);

function ptOf(e){ const b = roll.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; }
function hitAt(x, y){
  const r = Math.floor((y - RUL) / RH), tk = (x - KW) / CW;

function eraseAt(x, y){ const h = hitAt(x, y); if (h){ const a = PJ.tracks[curTrack]; a.splice(a.indexOf(h), 1); if (sel === h) sel = null; } }
roll.addEventListener('pointerdown', e => {
  if (e.button === 2) return;
  const { x, y } = ptOf(e), sl = wrap.scrollLeft, st = wrap.scrollTop;

    return;
  }

    const edge = KW + (hit.s + hit.l) * CW;

    const s = Math.floor(tk / snapV) * snapV;
    const n = { s, l: curTrack === 'drum' ? 1 : snapV, p };
    if (curTrack === 'vocal') n.lyric = 'ら';
    PJ.tracks[curTrack].push(n); sel = n;

roll.addEventListener('pointermove', e => {

  } else if (drag.mode === 'move'){
    const dt = Math.round((x - drag.x0) / CW / snapV) * snapV, dr = Math.round((y - drag.y0) / RH);

}

// ----- 再生 -----
let playing = null;
async function togglePlay(){
  if (playing){ stopPlay(); return; }
  await AC.resume();
  $('btnPlay').textContent = '⏳ じゅんび中'; $('btnPlay').disabled = true;
  await sleep(30);
  try {
    const r = await getRendered();
    showMissing(r.missing);
    const src = AC.createBufferSource(); src.buffer = r.buf; src.connect(AC.destination);
    const s16 = sec16(), off = playStart * s16;
    src.start(0, off);
    playing = { src, t0: AC.currentTime - off, s16 };
    src.onended = () => { if (playing && playing.src === src) stopPlay(); };
    $('btnPlay').textContent = '■ とめる';
    requestAnimationFrame(follow);
  } catch (e){ console.error(e); setSongMsg('うまく再生できませんでした'); $('btnPlay').textContent = '▶ さいせい'; }
  $('btnPlay').disabled = false;
}
function follow(){
  if (!playing) return;
  const tk = (AC.currentTime - playing.t0) / playing.s16;
  if (tk >= ticks()){ stopPlay(); return; }
  const x = KW + tk * CW;
  playLine.style.display = 'block'; playLine.style.left = x + 'px';
  if (x > wrap.scrollLeft + wrap.clientWidth - 40 || x < wrap.scrollLeft + KW) wrap.scrollLeft = x - KW - 20;
  requestAnimationFrame(follow);
}
function stopPlay(){
  if (playing){ try { playing.src.stop(); } catch (e) {} playing = null; }
  playLine.style.display = 'none'; $('btnPlay').textContent = '▶ さいせい';
}
$('btnPlay').onclick = togglePlay;

function wavBlob(buf){
  const d = buf.getChannelData(0);
  let end = d.length; while (end > 0 && Math.abs(d[end - 1]) < 1e-4) end--;
  const n = Math.min(d.length, end + Math.round(SR * 0.3));
  const ab = new ArrayBuffer(44 + n * 2), v = new DataView(ab);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, SR, true);
  v.setUint32(28, SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, d[i])) * 32767, true);
  return new Blob([ab], { type: 'audio/wav' });
}
$('btnWav').onclick = async () => {
  setSongMsg('WAVを作っています…'); await sleep(30);
  const r = await getRendered(); download(wavBlob(r.buf), 'koe-vocalo-song.wav'); showMissing(r.missing);
  if (!r.missing.size) setSongMsg('WAVを保存しました');
};
$('btnSaveSong').onclick = () => {
  PJ.file = FILE_NAME;
  download(new Blob([JSON.stringify(PJ, null, 1)], { type: 'application/json' }), 'koe-vocalo-song.json');
};
$('btnOpenSong').onclick = () => $('fileSong').click();
$('fileSong').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text()); if (d.kind !== 'song') throw 0;
    pushUndo(snapTracks()); PJ = Object.assign(emptyProject(), d); stopPlay(); saveLocal(); applyProjectToUI(); setSongMsg('曲をひらきました');
  } catch (err){ setSongMsg('このファイルはひらけません'); }
};
$('btnDemo').onclick = () => {
  if (Object.values(PJ.tracks).some(a => a.length) && !confirm('いまの曲をけして、サンプル曲をひらきますか？')) return;
  pushUndo(snapTracks()); PJ = demoProject(); stopPlay(); saveLocal(); applyProjectToUI(); selectTrack('vocal');
};
$('btnClrSong').onclick = () => {
  if (!confirm('ぜんぶの音符をけしますか？（「もどす」でもどせます）')) return;
  pushUndo(snapTracks()); PJ.tracks = { vocal: [], piano: [], bass: [], drum: [] }; saveLocal(); drawRoll();
};

// ---------- はじめ ----------
(async function init(){
  buildGrid();
  try { const s = localStorage.getItem('koe-vocalo-project'); PJ = s ? Object.assign(emptyProject(), JSON.parse(s)) : demoProject(); }
  catch (e){ PJ = demoProject(); }
  applyProjectToUI();
  await loadVoices();
  refreshGrid(); selectMora('あ'); drawRoll();
})();
</script>
