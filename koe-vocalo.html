<!DOCTYPE html>
<!-- ファイル名: koe-vocalo.html ／ こえボカロ（自分の声で歌うボカロ風アプリ） -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>こえボカロ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* デザイン：Y2Kラベンダー */
:root{
  --bg:#f3efff; --paper:#fff; --ink:#16121f; --sub:#6b6385; --line:#16121f; --soft:#e4dcff;
  --pink:#ff4fa3; --purple:#7b5cff; --mint:#2fd6b5; --yellow:#ffc93c;
  --acc:var(--purple); --acc2:var(--pink);
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --logo:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --num:"Outfit","Zen Kaku Gothic New",sans-serif;
  --pop:3px 3px 0 var(--ink);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-weight:500;
  background-image:radial-gradient(circle at 1px 1px,#d9cfff 1px,transparent 1.5px);background-size:22px 22px}
header{display:flex;align-items:center;gap:14px;padding:12px 16px;flex-wrap:wrap;background:var(--paper);border-bottom:2px solid var(--line)}
h1{font-family:var(--logo);font-weight:400;font-size:24px;margin:0;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.heart{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:99px;background:var(--pink);color:#fff;font-size:12px;border:2px solid var(--line)}
.en{font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.22em;color:var(--purple)}
nav{display:flex;gap:8px;margin-left:auto}
button{font-family:var(--jp);font-weight:700;font-size:15px;border:2px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:999px;padding:7px 15px;cursor:pointer;box-shadow:var(--pop);transition:transform .06s,box-shadow .06s}
button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:disabled{opacity:.4;cursor:default;transform:none;box-shadow:var(--pop)}
button.on{background:var(--ink);color:#fff}
button.warn{color:#e0267f}
nav .tab{font-size:15px}
nav .tab.on{background:var(--pink);color:#fff}
select,input[type=number],input[type=text]{font-family:var(--jp);font-weight:700;font-size:15px;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
input[type=number]{width:74px;font-family:var(--num)}
input[type=range]{accent-color:var(--pink)}
input[type=checkbox]{accent-color:var(--purple);width:16px;height:16px}
.card{background:var(--paper);border-radius:20px;border:2px solid var(--line);box-shadow:4px 4px 0 var(--ink);padding:14px}
.page{display:none;padding:14px}
.page.on{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.small{font-size:13px;color:var(--sub)}
.msg{min-height:1.4em;color:#e0267f;font-weight:900;margin:6px 0}
/* 声をつくる */
.vwrap{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
#bigMora{font-family:var(--logo);font-size:84px;text-align:center;line-height:1.2;color:var(--ink);
  background:var(--soft);border:2px solid var(--line);border-radius:18px;margin-bottom:10px;position:relative}
#bigMora::after{content:"✦";position:absolute;right:12px;top:6px;font-size:20px;color:var(--pink)}
button.rec{background:var(--pink);color:#fff;font-size:22px;width:100%;padding:12px}
#wave{width:100%;height:110px;background:#faf8ff;border:2px solid var(--line);border-radius:14px;display:block;margin-top:8px}
#meter{height:10px;background:var(--soft);border:2px solid var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
#meterBar{height:100%;width:0;background:var(--pink);transition:width .05s}
.tip{background:#fff6d8;border:2px dashed var(--line);border-radius:14px;padding:8px 12px;font-size:15px;margin:10px 0 0}
details{margin:6px 0 12px}
summary{font-family:var(--logo);font-weight:400;font-size:16px;cursor:pointer;color:var(--purple)}
.mgrid{display:grid;gap:8px;margin:10px 0;max-width:440px}
.mora{font-size:21px;padding:7px 0;border-radius:14px;box-shadow:2px 2px 0 var(--ink)}
.mora.done{background:var(--purple);color:#fff}
.mora.sel{background:var(--pink);color:#fff;outline:none}
.mora.empty{visibility:hidden}
.count{font-family:var(--logo);font-weight:400;font-size:18px}
.count b{font-family:var(--num);font-weight:800;color:var(--pink)}
/* 曲をつくる */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar label{font-weight:700}
.sep{width:2px;height:28px;background:var(--soft);margin:0 2px;border-radius:2px}
#btnPlay{background:var(--pink);color:#fff;font-size:17px;min-width:130px}
.trk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 6px}
.trk input[type=range]{width:100px}
.trk label{font-size:12px;color:var(--sub)}
#vocalBar input[type=text]{flex:1;min-width:220px}
#vocalBar input[type=range]{width:110px}
#rollWrap{position:relative;overflow:auto;height:calc(100vh - 410px);min-height:300px;background:var(--paper);border-radius:18px;border:2px solid var(--line);box-shadow:4px 4px 0 var(--ink);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#rollWrap.pan{touch-action:pan-x pan-y}
button,select,input{touch-action:manipulation}
#btnMode.pan{background:var(--yellow)}
#selBar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 10px}
#rollSpace{position:relative}
#roll{display:block;position:sticky;left:0;top:0}
#playLine{position:absolute;top:0;width:3px;background:var(--pink);display:none;pointer-events:none}
.dlg{position:fixed;inset:0;background:rgba(22,18,31,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.dlg[hidden]{display:none}
.dlgCard{width:min(560px,92vw);max-height:86vh;overflow:auto}
.dlgTitle{font-family:var(--logo);font-weight:400;font-size:20px;margin:0 0 6px}
.impRow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:2px dashed var(--soft)}
.impRow .nm{flex:1;min-width:0}
.impRow .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:820px){.vwrap{grid-template-columns:1fr}}
@media (max-width:600px){
  .page{padding:10px}
  .card{padding:10px}
  button{font-size:14px;padding:6px 11px}
  .toolbar{gap:7px}
  .sep{display:none}
  .trk{flex-direction:row;padding:2px}
  .trk input[type=range]{width:64px}
  #rollHelp{display:none}
  #rollWrap{height:72vh}
  .en{display:none}
}
</style>
</head>
<body>
<header>
  <h1>こえボカロ <span class="heart">♡</span></h1>
  <span class="en">VOICE · SONG</span>
  <nav>
    <button class="tab on" data-tab="voice">① 声をつくる</button>
    <button class="tab" data-tab="song">② 曲をつくる</button>
  </nav>
</header>

<!-- ① 声をつくる -->
<section id="voice" class="page on">
  <div class="vwrap">
    <div class="card">
      <div id="bigMora">あ</div>
      <button id="btnRec" class="rec">● 録音</button>
      <div class="row">
        <button id="btnPlayRaw">▶ きく</button>
        <button id="btnSing">♪ うたわせる</button>
        <button id="btnDelOne" class="warn">けす</button>
      </div>
      <canvas id="wave" width="640" height="220"></canvas>
      <div id="vinfo" class="small"></div>
      <div id="meter"><div id="meterBar"></div></div>
      <div id="recMsg" class="msg"></div>
      <div class="row">
        <label>録音の高さ
          <select id="baseNote">
            <option value="45">ラ2（ひくい）</option>
            <option value="48">ド3</option>
            <option value="53" selected>ファ3</option>
            <option value="57">ラ3</option>
            <option value="60">ド4</option>
            <option value="64">ミ4（たかい）</option>
          </select>
        </label>
      </div>
      <label class="row"><input type="checkbox" id="autoNext" checked> 録音したら つぎの音へ</label>
      <p class="tip">ピッ・ピッ・ピッ のあとに<br>「かーーー」と ピッと同じ高さで<br>1びょう のばして言う</p>
    </div>
    <div class="card">
      <div class="count" id="voiceCount"></div>
      <div class="small">録音していない音は、母音（あいうえお）か「機械の声」で歌います</div>
      <div id="grid"></div>
      <div class="row">
        <button id="btnExpVoice">💾 声をファイルに保存</button>
        <button id="btnImpVoice">📂 声のファイルをひらく</button>
        <button id="btnClrVoice" class="warn">ぜんぶけす</button>
        <input type="file" id="fileVoice" hidden>
      </div>
    </div>
  </div>
</section>

<!-- ② 曲をつくる -->
<section id="song" class="page">
  <div class="card toolbar">
    <button id="btnPlay">▶ さいせい</button>
    <button id="btnUndo">↩ もどす</button>
    <span class="sep"></span>
    <label>テンポ <input type="number" id="bpm" min="40" max="240" value="110"></label>
    <label>小節 <input type="number" id="bars" min="1" max="256" value="8"></label>
    <label>音符
      <select id="snap">
        <option value="1">16分</option>
        <option value="2" selected>8分</option>
        <option value="4">4分</option>
        <option value="8">2分</option>
      </select>
    </label>
    <button id="btnMode">✏️ かく</button>
    <button id="btnEraser">🧽 けしゴム</button>
    <span class="sep"></span>
    <button id="btnWav">🎵 WAVで保存</button>
  </div>
  <div class="card toolbar" id="trackBar"></div>
  <div class="card toolbar" id="vocalBar">
    <label>歌詞</label>
    <input type="text" id="lyricText" placeholder="れい：あおいそらに（ひらがな）">
    <button id="btnFlow">音符に ながしこむ</button>
    <label>ビブラート <input type="range" id="vib" min="0" max="80" value="35"></label>
    <label>声色 おとな <input type="range" id="gen" min="-5" max="5" value="0"> こども</label>
  </div>
  <div id="selBar">
    <button id="btnLyric" disabled>🔤 歌詞をかえる</button>
    <button id="btnDelNote" class="warn" disabled>🗑 この音符をけす</button>
    <span class="small" id="rollHelp">タップ：音符をおく ／ ドラッグ：うごかす・のばす ／ 右はし：長さ ／ 上の目もり：再生する場所 ／ ✋にすると指でスクロール</span>
  </div>
  <div id="rollWrap"><div id="rollSpace"><canvas id="roll"></canvas><div id="playLine"></div></div></div>
  <div id="songMsg" class="msg"></div>
  <div class="row">
    <button id="btnSaveSong">💾 曲を保存</button>
    <button id="btnOpenSong">📂 曲をひらく</button>
    <button id="btnImport">📥 MIDI・楽譜をよみこむ</button>
    <button id="btnDemo">🎼 サンプル曲</button>
    <button id="btnClrSong" class="warn">ぜんぶけす</button>
    <input type="file" id="fileSong" hidden>
    <input type="file" id="fileImport" hidden>
  </div>
</section>

<div id="importDlg" class="dlg" hidden>
  <div class="card dlgCard">
    <h2 class="dlgTitle">📥 よみこみ</h2>
    <div class="small" id="impFile"></div>
    <div id="impList"></div>
    <label class="row"><input type="checkbox" id="impTempo" checked> <span id="impTempoLabel">テンポも読みこむ</span></label>
    <div class="small">いまの曲は入れかわります（「↩ もどす」で音符はもどせます）</div>
    <div class="msg" id="impMsg"></div>
    <div class="row" style="justify-content:flex-end">
      <button id="impCancel">やめる</button>
      <button id="impOk" class="on">読みこむ</button>
    </div>
  </div>
</div>

<script>
'use strict';
// ファイル名: koe-vocalo.html
const FILE_NAME = 'koe-vocalo.html';
const AC = new (window.AudioContext || window.webkitAudioContext)();
const SR = AC.sampleRate;

// ==DSP==
function hz(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function median(a){ const b = Array.from(a).sort((x, y) => x - y); return b[Math.floor(b.length / 2)]; }

// 前後の無音をけずる
function trimSilence(x){
  const fr = Math.round(SR * 0.01), nF = Math.floor(x.length / fr);
  if (nF < 5) return null;
  let mean = 0; for (let i = 0; i < x.length; i++) mean += x[i]; mean /= x.length;
  const r = new Float32Array(nF); let pk = 0;
  for (let i = 0; i < nF; i++){
    let s = 0; for (let j = 0; j < fr; j++){ const v = x[i * fr + j] - mean; s += v * v; }
    r[i] = Math.sqrt(s / fr); if (r[i] > pk) pk = r[i];
  }
  if (pk < 0.008) return null;
  const nf = Array.from(r).sort((a, b) => a - b)[Math.floor(nF * 0.1)];
  const thr = Math.max(nf * 4, pk * 0.06, 0.002);
  let a = 0; while (a < nF && r[a] < thr) a++;
  let b = nF - 1; while (b > a && r[b] < thr) b--;
  const s0 = Math.max(0, (a - 3) * fr), s1 = Math.min(x.length, (b + 3) * fr);
  if (s1 - s0 < SR * 0.15) return null;
  const y = new Float32Array(s1 - s0);
  for (let i = 0; i < y.length; i++) y[i] = x[s0 + i] - mean;
  const fl = Math.round(SR * 0.005);
  for (let i = 0; i < fl; i++){ const k = i / fl; y[i] *= k; y[y.length - 1 - i] *= k; }
  return y;
}

function rmsOf(x, a, b){ let s = 0; a = Math.max(0, a | 0); b = Math.min(x.length, b | 0); for (let i = a; i < b; i++) s += x[i] * x[i]; return Math.sqrt(s / Math.max(1, b - a)); }
function unvoicedS(raw){ return { ok: false, raw, gain: Math.min(30, 0.2 / Math.max(1e-4, rmsOf(raw, 0, raw.length))), f0: 0 }; }

// 声を分析：音の高さ・母音のはじまり・ピッチマーク
function analyze(raw){
  const N = raw.length;
  const dec = Math.max(1, Math.round(SR / 11025)), dsr = SR / dec;
  const n = Math.floor(N / dec), x = new Float32Array(n);
  for (let i = 0; i < n; i++){ let s = 0; for (let j = 0; j < dec; j++) s += raw[i * dec + j]; x[i] = s / dec; }
  const hop = Math.max(1, Math.round(dsr * 0.005)), W = Math.round(dsr * 0.03);
  const minLag = Math.max(2, Math.floor(dsr / 1000)), maxLag = Math.ceil(dsr / 65);
  const F = [], V = [], R = [];
  const d = new Float32Array(maxLag + 2), cm = new Float32Array(maxLag + 2);
  for (let c = 0; c + W + maxLag + 1 < n; c += hop){
    let e = 0; for (let j = 0; j < W; j++) e += x[c + j] * x[c + j];
    R.push(Math.sqrt(e / W));
    for (let tau = 1; tau <= maxLag + 1; tau++){
      let s = 0; for (let j = 0; j < W; j++){ const df = x[c + j] - x[c + j + tau]; s += df * df; }
      d[tau] = s;
    }
    let run = 0; cm[0] = 1;
    for (let tau = 1; tau <= maxLag + 1; tau++){ run += d[tau]; cm[tau] = run > 0 ? d[tau] * tau / run : 1; }
    let best = -1;
    for (let tau = minLag; tau <= maxLag; tau++){
      if (cm[tau] < 0.15){ while (tau + 1 <= maxLag && cm[tau + 1] < cm[tau]) tau++; best = tau; break; }
    }
    if (best < 0){
      let mv = 1e9, bt = minLag;
      for (let tau = minLag; tau <= maxLag; tau++) if (cm[tau] < mv){ mv = cm[tau]; bt = tau; }
      best = mv <= 0.3 ? bt : -1;
    }
    if (best > 0){
      const A = cm[best - 1], B = cm[best], C = cm[best + 1];
      const den = A - 2 * B + C; let sh = den !== 0 ? 0.5 * (A - C) / den : 0;
      sh = Math.max(-1, Math.min(1, sh));
      F.push(dsr / (best + sh)); V.push(1);
    } else { F.push(0); V.push(0); }
  }
  const nf = F.length;
  if (nf < 12) return unvoicedS(raw);
  let pkR = 0; for (const r of R) if (r > pkR) pkR = r;
  for (let i = 0; i < nf; i++) if (R[i] < pkR * 0.08) V[i] = 0;
  const vf = F.filter((f, i) => V[i]);
  if (vf.length < 10) return unvoicedS(raw);
  const med = median(vf);
  for (let i = 0; i < nf; i++) if (V[i]){
    let f = F[i]; while (f > med * 1.7) f /= 2; while (f < med * 0.6) f *= 2; F[i] = f;
  }
  const F2 = F.slice();
  for (let i = 0; i < nf; i++) if (V[i]){
    const nb = []; for (let k = i - 2; k <= i + 2; k++) if (k >= 0 && k < nf && V[k]) nb.push(F[k]);
    F2[i] = median(nb);
  }
  const fc = i => (i * hop + W / 2) * dec;
  const frameAt = s => Math.max(0, Math.min(nf - 1, Math.round((s / dec - W / 2) / hop)));
  const K = 8;
  let vsF = -1;
  for (let i = 0; i + K <= nf && vsF < 0; i++){ let ok = true; for (let k = 0; k < K; k++) if (!V[i + k]){ ok = false; break; } if (ok) vsF = i; }
  if (vsF < 0) return unvoicedS(raw);
  let veF = -1;
  for (let i = nf - 1; i - K + 1 >= 0 && veF < 0; i--){ let ok = true; for (let k = 0; k < K; k++) if (!V[i - k]){ ok = false; break; } if (ok) veF = i; }
  veF -= 6;
  if (veF < vsF + 10) veF = Math.min(nf - 1, vsF + 10);
  const vs = Math.round(fc(vsF)), ve = Math.min(N - 1, Math.round(fc(veF)));
  // ピーク検出用に少しなめらかにした信号
  const lp = new Float32Array(N), hk = Math.max(1, Math.round(SR * 0.0006));
  let acc = 0;
  for (let i = 0; i < N + hk; i++){
    if (i < N) acc += raw[i];
    if (i - 2 * hk - 1 >= 0) acc -= raw[i - 2 * hk - 1];
    const c = i - hk; if (c >= 0 && c < N) lp[c] = acc;
  }
  const pos = [], per = [], voi = [];
  const U = Math.round(SR * 0.005);
  let s = 0, lastV = false;
  while (s < N){
    const fi = frameAt(s);
    if (V[fi]){
      const Pp = SR / F2[fi];
      const center = lastV ? s : s + Pp * 0.5, rad = lastV ? Pp * 0.15 : Pp * 0.5;
      const a = Math.max(0, Math.floor(center - rad)), b = Math.min(N - 1, Math.ceil(center + rad));
      let bi = a, bv = -1e9; for (let i = a; i <= b; i++) if (lp[i] > bv){ bv = lp[i]; bi = i; }
      if (bi < s - Pp * 0.5) bi = Math.round(s);
      pos.push(bi); per.push(Pp); voi.push(1); s = bi + Pp; lastV = true;
    } else {
      pos.push(Math.round(s)); per.push(U); voi.push(0); s += U; lastV = false;
    }
  }
  const gain = Math.min(30, 0.2 / Math.max(1e-4, rmsOf(raw, vs, ve)));
  const ls = vs + Math.round((ve - vs) * 0.35);
  return { ok: true, raw, vs, ve, ls, pos: Int32Array.from(pos), per: Float32Array.from(per), voi: Uint8Array.from(voi), gain, f0: med };
}

function nearestMark(pos, t){
  let lo = 0, hi = pos.length - 1;
  while (hi - lo > 1){ const m = (lo + hi) >> 1; if (pos[m] <= t) lo = m; else hi = m; }
  return Math.abs(pos[hi] - t) < Math.abs(pos[lo] - t) ? hi : lo;
}

function addGrain(out, ws, t, raw, m, P, g){
  const L = Math.max(2, Math.round(P / g)), tc = Math.round(t);
  for (let j = -L; j <= L; j++){
    const o = tc + j; if (o < 0 || o >= out.length) continue;
    const xi = m + j * g, i0 = Math.floor(xi);
    if (i0 < 0 || i0 + 1 >= raw.length) continue;
    const w = 0.5 + 0.5 * Math.cos(Math.PI * j / L);
    const fr = xi - i0;
    out[o] += w * (raw[i0] + (raw[i0 + 1] - raw[i0]) * fr);
    ws[o] += w;
  }
}

// 1つの音符を歌わせる（TD-PSOLA）
// 返り値 buf の 0 は「音符のはじまり − pre（子音のぶん）」
function renderNote(S, midi, durSec, prevMidi, noCons, vib, g){
  const dur = Math.max(1, Math.round(durSec * SR));
  if (!S.ok){
    const len = Math.min(S.raw.length, dur), out = new Float32Array(len);
    for (let i = 0; i < len; i++) out[i] = S.raw[i] * S.gain;
    fadeEdges(out, 64, Math.round(SR * 0.02));
    return { buf: out, pre: 0 };
  }
  const { raw, pos, per, voi, vs, ve, ls } = S;
  const pre = noCons ? 0 : Math.min(vs, Math.round(SR * 0.25));
  const total = pre + dur;
  const out = new Float32Array(total), ws = new Float32Array(total);
  const first = Math.max(1, ve - vs), loopLen = Math.max(1, ve - ls);
  const tauOf = tv => {
    if (tv < first) return vs + tv;
    const e = tv - first, k = Math.floor(e / loopLen), r = e - k * loopLen;
    return (k % 2 === 0) ? ve - r : ls + r;
  };
  const vibStart = 0.22;
  const pitchAt = sec => {
    let m = midi;
    if (prevMidi != null && prevMidi !== midi){
      const T = 0.08;
      if (sec <= 0) m = prevMidi;
      else if (sec < T){ const k = sec / T; m = prevMidi + (midi - prevMidi) * k * k * (3 - 2 * k); }
    }
    if (vib > 0 && durSec > 0.35 && sec > vibStart){
      const dep = vib * Math.min(1, (sec - vibStart) / 0.3);
      m += dep / 100 * Math.sin(2 * Math.PI * 5.5 * (sec - vibStart));
    }
    return hz(m);
  };
  let t = 0;
  while (t < total){
    const tv = t - pre;
    const mi = nearestMark(pos, tauOf(tv));
    if (voi[mi]){ addGrain(out, ws, t, raw, pos[mi], per[mi], g); t += SR / pitchAt(tv / SR); }
    else { addGrain(out, ws, t, raw, pos[mi], per[mi], 1); t += per[mi]; }
  }
  for (let i = 0; i < total; i++) out[i] = out[i] / Math.max(1, ws[i]) * S.gain;
  fadeEdges(out, noCons ? Math.round(SR * 0.015) : 64, Math.round(SR * 0.025));
  return { buf: out, pre };
}

function fadeEdges(a, fi, fo){
  fi = Math.min(fi, a.length >> 1); fo = Math.min(fo, a.length >> 1);
  for (let i = 0; i < fi; i++) a[i] *= i / fi;
  for (let i = 0; i < fo; i++) a[a.length - 1 - i] *= i / fo;
}

const FORM = {
  a: [[800, 80, 1], [1200, 90, 0.7], [2600, 120, 0.25]],
  i: [[300, 60, 1], [2300, 100, 0.5], [3000, 120, 0.35]],
  u: [[350, 60, 1], [1300, 90, 0.35], [2400, 120, 0.15]],
  e: [[500, 70, 1], [1900, 100, 0.55], [2600, 120, 0.3]],
  o: [[500, 70, 1], [850, 80, 0.8], [2600, 120, 0.15]],
  n: [[250, 50, 1], [1200, 120, 0.08], [2300, 150, 0.05]]
};
function makeSynth(v){
  const f0 = 200, len = Math.round(SR * 0.9), y = new Float32Array(len);
  const H = Math.floor(5000 / f0), amps = [], ph = [];
  for (let h = 1; h <= H; h++){
    const f = h * f0; let e = 0;
    for (const [Fq, B, A] of FORM[v]) e += A / (1 + ((f - Fq) / B) ** 2);
    amps.push(e / Math.sqrt(h) + 0.003 / h); ph.push((h * 2.399) % 6.283);
  }
  let phi = 0, pk = 0;
  for (let i = 0; i < len; i++){
    const ff = f0 * (1 + 0.004 * Math.sin(2 * Math.PI * 0.7 * i / SR));
    phi += 2 * Math.PI * ff / SR;
    let s = 0; for (let h = 1; h <= H; h++) s += amps[h - 1] * Math.sin(h * phi + ph[h - 1]);
    y[i] = s; if (Math.abs(s) > pk) pk = Math.abs(s);
  }
  for (let i = 0; i < len; i++) y[i] *= 0.5 / pk;
  fadeEdges(y, Math.round(SR * 0.02), Math.round(SR * 0.03));
  return y;
}

function kataToHira(s){ return s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
function normLyric(s){ s = kataToHira(s || ''); return ALIAS[s] || s; }
function vowelOf(ly){ if (!ly) return null; return VOW[ly[ly.length - 1]] || null; }
function toMorae(text){
  const t = kataToHira(text).replace(/[\s、。,.!?！？「」『』・]/g, '');
  const out = [];
  for (let i = 0; i < t.length; i++){
    let c = t[i];
    if (i + 1 < t.length && SMALL.includes(t[i + 1])){ c += t[i + 1]; i++; }
    out.push(c);
  }

}

function resolve(ly){
  ly = normLyric(ly);
  if (voices[ly]) return { S: voices[ly], miss: false };
  const v = vowelOf(ly);
  if (v && voices[VK[v]]) return { S: voices[VK[v]], miss: true };
  return { S: synth[v || 'a'], miss: true };
}

// IndexedDB
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('koe-vocalo', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('voices');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbDo(mode, fn){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('voices', mode), st = tx.objectStore('voices');
    const out = fn(st);
    tx.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    tx.onerror = () => rej(tx.error);
  });
}
const idbPut = (k, v) => idbDo('readwrite', st => { st.put(v, k); });
const idbDel = k => idbDo('readwrite', st => { st.delete(k); });
const idbClear = () => idbDo('readwrite', st => { st.clear(); });
async function idbLoadAll(){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('voices', 'readonly'), st = tx.objectStore('voices');
    const out = {}; const rq = st.openCursor();
    rq.onsuccess = () => { const c = rq.result; if (c){ out[c.key] = c.value; c.continue(); } };
    tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error);
  });
}
function resample(x, from, to){
  if (from === to) return x;
  const n = Math.round(x.length * to / from), y = new Float32Array(n), r = from / to;
  for (let i = 0; i < n; i++){ const p = i * r, i0 = Math.floor(p), f = p - i0; y[i] = (x[i0] || 0) + ((x[i0 + 1] || 0) - (x[i0] || 0)) * f; }
  return y;
}
async function saveVoice(m, S){
  const rec = { sr: SR, raw: S.raw, an: S.ok ? { ok: true, vs: S.vs, ve: S.ve, ls: S.ls, pos: S.pos, per: S.per, voi: S.voi, gain: S.gain, f0: S.f0 } : { ok: false, gain: S.gain, f0: 0 } };
  await idbPut(m, rec);
}
async function loadVoices(){
  try {
    const all = await idbLoadAll();
    for (const [m, rec] of Object.entries(all)){
      if (rec.sr === SR && rec.an){ voices[m] = Object.assign({ raw: rec.raw }, rec.an); }
      else { const raw = resample(rec.raw, rec.sr, SR); const S = analyze(raw); voices[m] = S; saveVoice(m, S); }
    }
  } catch (e){ console.warn(e); }
  voiceVer++;
}

  }

  for (let px = 0; px < W; px++){
    const a = Math.floor(px / W * n), b = Math.floor((px + 1) / W * n); let mn = 0, mx = 0;
    for (let i = a; i < b; i++){ if (x[i] < mn) mn = x[i]; if (x[i] > mx) mx = x[i]; }
    c.moveTo(px, H / 2 - mx * H * 0.48 * Math.min(4, S.gain * 1.5)); c.lineTo(px, H / 2 - mn * H * 0.48 * Math.min(4, S.gain * 1.5));

async function ensureMic(){
  if (micStream && micStream.getAudioTracks().some(t => t.readyState === 'live')) return;
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
}
function capture(sec){
  return new Promise(res => {
    const src = AC.createMediaStreamSource(micStream);
    const pr = AC.createScriptProcessor(2048, 1, 1);
    const chunks = []; let got = 0; const need = Math.round(sec * SR); let done = false;
    pr.onaudioprocess = e => {
      if (done) return;
      const d = e.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d)); got += d.length;
      let pk = 0; for (let i = 0; i < d.length; i++){ const a = Math.abs(d[i]); if (a > pk) pk = a; }
      $('meterBar').style.width = Math.min(100, pk * 150) + '%';
      if (got >= need){
        done = true; pr.disconnect(); src.disconnect(); $('meterBar').style.width = '0';
        const out = new Float32Array(got); let o = 0; for (const ch of chunks){ out.set(ch, o); o += ch.length; }
        res(out);
      }
    };
    src.connect(pr); pr.connect(AC.destination);
  });
}

function f32ToB64(f){
  const u = new Uint8Array(f.length * 2), dv = new DataView(u.buffer);
  for (let i = 0; i < f.length; i++) dv.setInt16(i * 2, Math.max(-1, Math.min(1, f[i])) * 32767, true);
  let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64ToF32(b){
  const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  const dv = new DataView(u.buffer), f = new Float32Array(u.length / 2);
  for (let i = 0; i < f.length; i++) f[i] = dv.getInt16(i * 2, true) / 32767;
  return f;
}

    } else {
      const pr = v[i - 1];
      n.lyric = (hasLy && pr && pr.s + pr.l === n.s) ? 'ー' : 'ら';
    }
  });
  T.vocal = v;
  pushUndo(snapTracks());
  stopPlay();
  PJ.tracks = T;
  PJ.bars = Math.max(1, Math.min(256, Math.ceil(maxEnd / 16) || 8));
  for (const k in PJ.tracks) PJ.tracks[k] = PJ.tracks[k].filter(n => n.s < ticks()).map(n => (n.l = Math.min(n.l, ticks() - n.s), n));
  if ($('impTempo').checked && impModel.tempo) PJ.bpm = Math.max(40, Math.min(240, Math.round(impModel.tempo)));
  PJ.lyric = v.map(n => n.lyric).filter(x => x !== 'ー').join('');
  playStart = 0; saveLocal(); applyProjectToUI(); selectTrack(v.length ? 'vocal' : 'piano');
  $('importDlg').hidden = true;
  const notes = [];
  if (maxEnd > 256 * 16) notes.push('長いので256小節までにしました');
  if (kanji) notes.push(`漢字などの歌詞 ${kanji}こ は「ら」にしました`);
  if (skipDrum) notes.push(`ドラムにない音 ${skipDrum}こ はとばしました`);
  setSongMsg('読みこみました' + (notes.length ? '（' + notes.join('・') + '）' : ''));
}
$('btnImport').onclick = () => $('fileImport').click();
$('fileImport').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const buf = await f.arrayBuffer(), h = new Uint8Array(buf.slice(0, 4));
    const sig = String.fromCharCode(...h);
    let model;
    if (sig === 'MThd') model = readMidi(buf);
    else if (sig.startsWith('PK')) model = readMusicXML(await unzipFirstXml(buf));
    else {
      const txt = new TextDecoder().decode(buf);
      if (!txt.includes('<score-partwise')) throw new Error('unknown');
      model = readMusicXML(txt);
    }
    openImportDialog(model, f.name);
  } catch (err){
    console.warn(err);
    setSongMsg(err.message === 'timewise' ? 'この形式のMusicXMLはまだ読みこめません' : '読みこめませんでした。MIDI（.mid）か MusicXML（.musicxml / .mxl / .xml）をえらんでください');
  }
};
$('impCancel').onclick = () => { $('importDlg').hidden = true; };
$('impOk').onclick = applyImport;

// ---------- はじめ ----------
(async function init(){
  buildGrid();
  try { const s = localStorage.getItem('koe-vocalo-project'); PJ = s ? Object.assign(emptyProject(), JSON.parse(s)) : demoProject(); }
  catch (e){ PJ = demoProject(); }
  applyProjectToUI();
  await loadVoices();
  refreshGrid(); selectMora('あ'); drawRoll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawRoll(); drawWave(); });
})();
</script>
